name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Version stylesheet to refresh browser caches
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const css = readFileSync('dist/styles.css', 'utf8').replaceAll('\r\n', '\n');
          const version = createHash('sha256').update(css).digest('hex').slice(0, 12);
          const html = readFileSync('dist/index.html', 'utf8');
          const reference = /href="\.\/styles\.css(?:\?[^"]*)?"/;
          if (!reference.test(html)) throw new Error('Stylesheet reference missing');
          writeFileSync('dist/index.html', html.replace(reference, 'href="./styles.css?v=' + version + '"'));
          NODE
      - name: Validate site
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
